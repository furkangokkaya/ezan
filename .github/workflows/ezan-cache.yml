# Ezan reposu (furkangokkaya/ezan) ile aynı — yerel kopya.
# Canlı workflow bu dosyanın ezan reposundaki halidir.

name: Ezan cache daily

on:
  schedule:
    # Paylaşım 00:45 TR. 00:20 / 00:35 / 00:45 TR → 21:20 / 21:35 / 21:45 UTC
    - cron: "20 21 * * *"
    - cron: "35 21 * * *"
    - cron: "45 21 * * *"
    - cron: "0 18 * * *"
    - cron: "0 20 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".trigger/**"

permissions:
  contents: write

concurrency:
  group: ezan-cache-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch origin
        run: git fetch origin main

      - name: Remote cache kontrol
        id: remote
        env:
          TZ: Europe/Istanbul
        run: python scripts/remote_ezan_cache_ready.py

      - name: Scrape Diyanet (3 deneme)
        id: scrape
        if: steps.remote.outputs.ready != 'true'
        env:
          TZ: Europe/Istanbul
        run: |
          for attempt in 1 2 3; do
            echo "Deneme $attempt/3"
            if python github_update_ezan_cache.py; then
              echo "updated=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((8 * attempt))
          done
          echo "updated=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::notice::Ezan vakitleri alinamadi — sonraki slot denenecek."
            exit 0
          fi
          exit 1

      - name: Verify cache
        if: steps.remote.outputs.ready != 'true' && steps.scrape.outputs.updated == 'true'
        env:
          TZ: Europe/Istanbul
        run: python scripts/verify_ezan_cache.py

      - name: Commit and push
        if: steps.remote.outputs.ready != 'true' && steps.scrape.outputs.updated == 'true'
        env:
          TZ: Europe/Istanbul
        run: python scripts/push_ezan_cache.py
